name: Test and deploy API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "frontend/model.js"
      - "frontend/taxonomy.js"
      - ".github/workflows/worker.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbt-annotation-api
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets are not set; skipping deployment."
            exit 0
          fi
          # Same pattern as CBT-Human-Evaluation: apply D1 migrations, then deploy the Worker.
          # Runtime secrets (ACCESS_CODE, TOKEN_SECRET, ADMIN_TOKEN) are stored in Cloudflare and persist across deploys.
          npx wrangler d1 migrations apply cbt_annotation --remote
          npx wrangler deploy
