name = "cbt-annotation-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://saif-daoud.github.io,http://localhost:5500,http://127.0.0.1:5500"

# Secrets (set once with `wrangler secret put`, never committed; they persist across deploys):
#   ACCESS_CODE   shared study access code typed by experts
#   TOKEN_SECRET  long random string used to sign login tokens
#   ADMIN_TOKEN   long random string for /api/admin/export and /api/admin/delete-expert

[[d1_databases]]
binding = "DB"
database_name = "cbt_annotation"
database_id = "95ac1975-123b-47a3-ab82-e3ec5b917f3b"
migrations_dir = "migrations"

# The first version stored data in a Durable Object; v2 retires that class (it only held the session seed).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnnotationStore"]

[[migrations]]
tag = "v2"
deleted_classes = ["AnnotationStore"]
